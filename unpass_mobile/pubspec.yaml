name: unpass_mobile
description: UN PASS on your phone — approve eSign requests and verify assets by scanning their label.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Scanning. mobile_scanner wraps Google's ML Kit barcode reader, which copes
  # with the damaged and dirty labels you get on real equipment.
  mobile_scanner: ^5.2.3

  # Keeps the session cookie and the device fingerprint in the Android Keystore
  # rather than plain preferences.
  flutter_secure_storage: ^9.2.2

  # Reads the hardware identifiers the fingerprint is built from.
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  crypto: ^3.0.5              # hashes the fingerprint; the raw ids never leave the phone
  http: ^1.2.2
  url_launcher: ^6.3.0        # opens the signing page in the phone's browser
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
