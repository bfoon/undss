plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "gm.unpass.mobile"
    // 35 because flutter_pdfview (and androidx.core 1.16) are built against it.
    // Compiling against a newer SDK is backward compatible and does not change
    // how the app behaves on a phone — that is targetSdk, left at 34 below.
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        // mobile_scanner's ML Kit dependency needs the newer library desugaring.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId = "gm.unpass.mobile"
        minSdk = 24            // ML Kit's floor; covers Android 7 and later
        targetSdk = 34         // the behaviour the app opts in to; raise deliberately, not by accident
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Set these in android/key.properties â€” see BUILD.md. Falls back to
            // the debug key so a first build works without any setup.
            def props = new Properties()
            def file = rootProject.file("key.properties")
            if (file.exists()) {
                file.withInputStream { props.load(it) }
                keyAlias = props["keyAlias"]
                keyPassword = props["keyPassword"]
                storeFile = props["storeFile"] ? rootProject.file(props["storeFile"]) : null
                storePassword = props["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            def hasKey = rootProject.file("key.properties").exists()
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter { source = "../.." }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
