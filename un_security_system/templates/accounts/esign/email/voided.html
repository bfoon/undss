{% extends "accounts/esign/email/_base_email.html" %}
{% block header_tag %}Envelope voided{% endblock %}
{% block body %}
  <p style="margin:0 0 14px;font-size:14px;line-height:1.6;">
    <b>{{ subject_line }}</b> has been voided by {{ sender_name }}. Any signing links you received
    are no longer valid.
  </p>
  {% if reason %}
  <div style="background:#F8FAFC;border:1px solid #E5E7EB;border-radius:10px;padding:12px;">
    <div style="font-size:12px;color:#6B7280;font-weight:700;margin-bottom:4px;">Reason</div>
    <div style="font-size:13px;white-space:pre-line;">{{ reason }}</div>
  </div>
  {% endif %}
{% endblock %}
