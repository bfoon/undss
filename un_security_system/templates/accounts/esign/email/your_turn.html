{% extends "accounts/esign/email/_base_email.html" %}
{% block header_tag %}It's your turn to sign{% endblock %}
{% block body %}
  <p style="margin:0 0 12px;font-size:15px;">Hello {{ recipient.name }},</p>
  <p style="margin:0 0 14px;font-size:14px;line-height:1.6;">
    The signers before you have completed their part. <b>{{ subject_line }}</b> is now waiting for you.
  </p>
  <div style="text-align:center;margin:22px 0;">
    <a href="{{ action_url }}"
       style="display:inline-block;background:#009EDB;color:#ffffff;text-decoration:none;
              padding:13px 30px;border-radius:8px;font-weight:700;font-size:15px;">
      Review &amp; sign
    </a>
  </div>
{% endblock %}
