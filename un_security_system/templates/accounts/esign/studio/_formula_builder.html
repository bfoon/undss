{% load static %}
{# accounts/templates/accounts/esign/studio/_formula_builder.html
   Include once on any page that lets someone write a formula. It brings in the
   shared engine, the drag-and-drop builder and the builder's styling; the
   modal itself is created on first use. #}
<style>
  .fxb-grid{ display:grid; grid-template-columns:300px 1fr; gap:1rem; min-height:420px; }
  @media (max-width: 991px){ .fxb-grid{ grid-template-columns:1fr; } }

  .fxb-palette{ border-right:1px solid var(--st-line,#e2e8f0); padding-right:.75rem; max-height:62vh; overflow:auto; }
  @media (max-width: 991px){ .fxb-palette{ border-right:0; max-height:none; } }
  .fxb-group{ margin-bottom:.9rem; }
  .fxb-group-name{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:#64748b; font-weight:700; margin-bottom:.35rem; }
  .fxb-group-hint{ text-transform:none; letter-spacing:0; font-weight:400; color:#94a3b8; }

  .fxb-card{
    border:1px solid var(--st-line,#e2e8f0); border-radius:.45rem; padding:.35rem .55rem; margin-bottom:.3rem;
    background:#fff; cursor:grab; display:flex; align-items:baseline; gap:.4rem;
    transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .fxb-card:hover{ border-color:var(--un-blue,#009edb); transform:translateX(2px); box-shadow:0 2px 8px rgba(16,42,67,.07); }
  .fxb-card:active{ cursor:grabbing; }
  .fxb-card-label{ font-size:.82rem; font-weight:600; color:#0f2a43; }
  .fxb-card-note{ font-size:.7rem; color:#94a3b8; margin-left:auto; white-space:nowrap; }
  .fxb-card[data-kind="fn"] .fxb-card-label{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#7b4fd0; }
  .fxb-card[data-preset] .fxb-card-label{ color:#127a45; }

  .fxb-canvas{
    border:2px dashed #cbd5e1; border-radius:.6rem; min-height:92px; padding:.6rem;
    display:flex; flex-wrap:wrap; align-items:center; background:#f8fafc; outline:none;
  }
  .fxb-canvas:focus{ border-color:var(--un-blue,#009edb); }
  .fxb-empty{ color:#94a3b8; font-size:.86rem; padding:.4rem; }

  .fxb-chip{
    display:inline-flex; align-items:center; gap:.3rem; border-radius:999px; padding:.2rem .6rem;
    font-size:.82rem; font-weight:600; cursor:grab; user-select:none; border:1px solid transparent;
    transition:filter .15s ease;
  }
  .fxb-chip:hover{ filter:brightness(.94); }
  .fxb-chip-x{ font-size:.7rem; opacity:.45; }
  .fxb-chip:hover .fxb-chip-x{ opacity:1; }
  .fxb-chip-ref{ background:#e1f0fb; color:#0b4a70; border-color:#b9ddf3; }
  .fxb-chip-context{ background:#eee7fb; color:#4b2a86; border-color:#d9cbf5; }
  .fxb-chip-fn{ background:#f3e8ff; color:#6b21a8; border-color:#e4d0fb; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .fxb-chip-op{ background:#eef2f7; color:#334155; border-color:#dbe3ec; }
  .fxb-chip-number{ background:#e7f7ee; color:#11603c; border-color:#c7ecd8; }
  .fxb-chip-text{ background:#fff7e6; color:#8a5a00; border-color:#f4e2bd; }
  .fxb-chip-bad{ background:#fdecea; color:#a52a1c; border-color:#f5c9c3; }

  .fxb-gap{ width:6px; height:26px; border-radius:3px; display:inline-block; }
  .fxb-gap.over{ background:var(--un-blue,#009edb); box-shadow:0 0 0 2px rgba(0,158,219,.2); }
  .fxb-gap.active{ background:#94a3b8; }

  .fxb-ops{ display:flex; flex-wrap:wrap; gap:.3rem; }
  .fxb-op{
    min-width:34px; border:1px solid var(--st-line,#e2e8f0); background:#fff; border-radius:.4rem;
    padding:.2rem .5rem; font-size:.9rem; line-height:1.3; color:#334155;
  }
  .fxb-op:hover{ border-color:var(--un-blue,#009edb); color:var(--un-dark-blue,#005a8b); }

  .fxb-raw{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.82rem; }

  .fxb-readout{ background:#f8fafc; border:1px solid var(--st-line,#e2e8f0); border-radius:.5rem; padding:.55rem .7rem; }
  .fxb-readout-line{ font-size:.82rem; color:#334155; display:flex; gap:.5rem; align-items:baseline; }
  .fxb-readout-line + .fxb-readout-line{ margin-top:.3rem; }
  .fxb-readout-tag{
    font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:#64748b;
    min-width:112px; font-weight:700;
  }

  /* the button that opens all this, wherever a formula can be written */
  .fx-open{
    border:1px solid var(--st-line,#e2e8f0); background:#fff; border-radius:.4rem;
    padding:.1rem .45rem; font-size:.78rem; font-weight:700; color:#6b21a8; white-space:nowrap;
  }
  .fx-open:hover{ border-color:#7b4fd0; background:#faf5ff; }
  .fx-preview{
    font-size:.74rem; color:#475569; background:#f8fafc; border:1px solid var(--st-line,#e2e8f0);
    border-radius:.4rem; padding:.25rem .45rem; min-height:26px; cursor:pointer; word-break:break-word;
  }
  .fx-preview:hover{ border-color:var(--un-blue,#009edb); }
  .fx-preview .fx-empty{ color:#94a3b8; }

  @media (prefers-reduced-motion: reduce){
    .fxb-card{ transition:none; }
  }
</style>
<script src="{% static 'accounts/esign/formula.js' %}"></script>
<script src="{% static 'accounts/esign/formula-builder.js' %}"></script>
