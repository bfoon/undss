{# accounts/templates/accounts/esign/studio/_form_styles.html — the on-screen form sheet #}
<style>
  .fs-sheet{ background:#fff; border:1px solid #E2E8F0; border-radius:.6rem; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.06); }
  .fs-header{ background:var(--fs-hbg); color:var(--fs-htext); padding:1.1rem 1.4rem; border-bottom:3px solid var(--fs-accent); }
  .fs-logo{ max-height:48px; margin-bottom:.5rem; }
  .fs-title{ font-size:1.35rem; font-weight:700; line-height:1.25; }
  .fs-subtitle{ opacity:.85; margin-top:.15rem; }
  .fs-body{ padding:1.2rem 1.4rem 1.5rem; }
  .fs-sheet.compact .fs-body{ --bs-gutter-y:.6rem; padding:.9rem 1.1rem 1.1rem; }
  .fs-label{ display:block; font-weight:600; font-size:.82rem; color:var(--fs-label); margin-bottom:.25rem; }
  .fs-value{ border-bottom:1px solid #E2E8F0; min-height:1.8rem; padding:.2rem 0; }
  .fs-heading{ font-weight:700; padding-bottom:.25rem; margin-top:.35rem; }
  .fs-h-sm{ font-size:.95rem; } .fs-h-md{ font-size:1.1rem; } .fs-h-lg{ font-size:1.35rem; }
  .fs-sig{ border:1.5px dashed #94A3B8; border-radius:.35rem; height:64px; display:flex; align-items:center; justify-content:center; color:#64748B; font-size:.82rem; background:#F8FAFC; }
  .fs-table th{ background:color-mix(in srgb, var(--fs-accent) 12%, white); font-size:.78rem; color:#0F172A; }
  .fs-sheet:not(.rounded-fields) .form-control, .fs-sheet:not(.rounded-fields) .form-select{ border-radius:0; }
  .fs-sheet .form-control:focus, .fs-sheet .form-select:focus{ border-color:var(--fs-accent); box-shadow:0 0 0 .2rem color-mix(in srgb, var(--fs-accent) 20%, transparent); }
</style>
<style>
  /* Conditional states. The server sets the class; _form_script.html keeps it
     up to date as answers change, so a section greys out as you type. */
  .fs-item{ transition:opacity .15s ease; }
  .fs-state-note{ display:none; font-size:.68rem; font-weight:600; vertical-align:middle; }
  .fs-state-disabled{ opacity:.55; }
  .fs-state-disabled .fs-state-note{ display:inline-block; }
  .fs-state-disabled .form-control, .fs-state-disabled .form-select,
  .fs-state-readonly .form-control, .fs-state-readonly .form-select{ background:#F1F4F7; }
  .fs-state-completed .fs-state-note{ display:inline-block; background:#E2E8F0!important; color:#475569!important; }
  .fs-state-completed .fs-label{ color:#475569; }
  /* a greyed-out heading dims its whole section heading row */
  .fs-state-disabled .fs-heading, .fs-state-disabled .fs-para{ opacity:.75; }
  .fs-heading .fs-state-note{ font-weight:500; vertical-align:middle; }
  /* the reason belongs on the heading; fields in that section stay quiet */
  .fs-note-quiet{ display:none!important; }
  /* marks the section this person is being asked to complete */
  .fs-mine-tag{ font-size:.72rem; font-weight:700; letter-spacing:.02em; color:#1D4ED8; text-transform:uppercase; margin-bottom:-.35rem; }
  .fs-state-hidden{ display:none; }
</style>
