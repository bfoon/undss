{# accounts/templates/accounts/esign/studio/_styles.html — shared look for every eSign Studio page #}
<style>
  :root{ --st-blue:var(--un-blue,#009EDB); --st-dark:#005A8B; --st-ink:#0F172A; --st-muted:#64748B; --st-line:#E2E8F0; --st-soft:#F8FAFC; }
  .es-hero{ background:linear-gradient(135deg, rgba(0,158,219,.10), rgba(0,90,139,.08)); border:1px solid rgba(0,158,219,.15); }
  .es-kpi{ border-left:4px solid var(--st-blue); background:#fff; }
  .es-kpi.warn{ border-left-color:#F59E0B; }
  .es-row{ transition:background .12s ease; }
  .es-row:hover{ background:rgba(0,158,219,.04); }
  .es-token{ font-family:ui-monospace,Menlo,monospace; font-size:.72rem; color:var(--un-gray,#6B7280); }
  .st-nav{ gap:.35rem; }
  .st-nav .nav-link{ color:#334155; border-radius:999px; padding:.4rem .9rem; font-weight:500; border:1px solid transparent; }
  .st-nav .nav-link:hover{ background:rgba(0,158,219,.07); }
  .st-nav .nav-link.active{ background:#fff; color:var(--st-dark); border-color:rgba(0,158,219,.35); box-shadow:0 1px 2px rgba(15,23,42,.06); }
  .st-nav .badge{ font-size:.65rem; }
  .st-card{ background:#fff; border:1px solid var(--st-line); border-radius:.6rem; }
  .st-tile{ display:flex; gap:.8rem; align-items:flex-start; padding:.9rem 1rem; border:1px solid var(--st-line); border-radius:.6rem;
            background:#fff; color:inherit; text-decoration:none; height:100%; transition:border-color .12s, box-shadow .12s, transform .12s; }
  .st-tile:hover{ border-color:rgba(0,158,219,.55); box-shadow:0 4px 14px rgba(0,90,139,.08); transform:translateY(-1px); color:inherit; }
  .st-tile .st-ico{ width:40px; height:40px; flex:0 0 40px; border-radius:.55rem; display:flex; align-items:center; justify-content:center;
                    background:rgba(0,158,219,.10); color:var(--st-dark); font-size:1.2rem; }
  .st-tile .st-t{ font-weight:600; color:var(--st-ink); line-height:1.25; }
  .st-tile .st-d{ font-size:.8rem; color:var(--st-muted); margin-top:.15rem; }
  .st-group-label{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--st-muted); font-weight:700; }
  .st-drop{ border:2px dashed rgba(0,158,219,.45); border-radius:.75rem; background:rgba(0,158,219,.04); padding:1.6rem; text-align:center;
            cursor:pointer; transition:background .12s, border-color .12s; }
  .st-drop.over{ background:rgba(0,158,219,.10); border-color:var(--st-blue); }
  .st-drop .bi{ font-size:2rem; color:var(--st-blue); }
  .st-chip{ display:inline-flex; align-items:center; gap:.35rem; background:#EEF6FB; color:#0C4A6E; border:1px solid #CFE8F5;
            border-radius:999px; padding:.15rem .3rem .15rem .6rem; font-size:.8rem; margin:.15rem .25rem .15rem 0; }
  .st-chip button{ border:0; background:transparent; color:#0C4A6E; line-height:1; padding:0 .2rem; }
  .st-pages{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  /* page boxes and canvases inside .st-pages are sized by the viewer (see _pdf_viewer.html) */
  .st-viewer{ background:#E9EEF3; border-radius:.5rem; padding:14px; max-height:78vh; overflow:auto; }
  .st-empty{ text-align:center; color:var(--st-muted); padding:2.2rem 1rem; }
  .st-empty .bi{ font-size:2rem; opacity:.5; display:block; margin-bottom:.4rem; }
  .st-status{ font-size:.72rem; font-weight:600; }
  .st-picker{ position:relative; }
  .st-picker .st-menu{ position:absolute; z-index:1060; left:0; right:0; top:100%; background:#fff; border:1px solid var(--st-line);
                       border-radius:.4rem; box-shadow:0 8px 24px rgba(15,23,42,.12); max-height:240px; overflow:auto; display:none; }
  .st-picker .st-menu.show{ display:block; }
  .st-picker .st-opt{ padding:.4rem .7rem; cursor:pointer; font-size:.85rem; }
  .st-picker .st-opt.hl, .st-picker .st-opt:hover{ background:rgba(0,158,219,.08); }
  .st-picker .st-box{ border:1px solid #CED4DA; border-radius:.375rem; padding:.2rem .35rem; background:#fff; min-height:38px; display:flex; flex-wrap:wrap; align-items:center; }
  .st-picker .st-box:focus-within{ border-color:#86b7fe; box-shadow:0 0 0 .2rem rgba(13,110,253,.15); }
  .st-picker input{ border:0; outline:0; flex:1; min-width:140px; padding:.25rem; font-size:.9rem; }
  .st-map{ background:radial-gradient(#D7E1EA 1px, transparent 1px) 0 0/18px 18px, #F8FAFC; border-radius:.5rem; border:1px solid var(--st-line); overflow:auto; }
  .st-timeline{ list-style:none; padding:0; margin:0; }
  .st-timeline li{ position:relative; padding:0 0 .85rem 1.9rem; }
  .st-timeline li:before{ content:""; position:absolute; left:.62rem; top:1.4rem; bottom:0; width:1px; background:var(--st-line); }
  .st-timeline li:last-child:before{ display:none; }
  .st-timeline .st-dot{ position:absolute; left:0; top:.1rem; width:1.3rem; height:1.3rem; border-radius:50%; background:#EEF6FB; color:var(--st-dark);
                        display:flex; align-items:center; justify-content:center; font-size:.7rem; }
  @media (max-width: 991px){ .st-desktop-only{ display:none!important; } }

  /* ── Layout guard ────────────────────────────────────────────────────────
     Site-wide rules such as `canvas { max-height: 450px }` (common for dashboard
     charts) or `img, svg { height: auto }` squash document pages and misplace
     edits. Everything whose exact size carries meaning is pinned here, with
     enough specificity and !important to win over generic element rules.
     Page canvases are also sized with inline !important styles in JavaScript. */
  .st-viewer .st-page, .st-viewer .st-page canvas,
  .ed-canvas .ed-page, .ed-canvas .ed-page canvas.pdf,
  .org-grid .org-thumb canvas{ max-width:none!important; max-height:none!important; min-width:0!important; min-height:0!important; }
  .ed-canvas .ed-page canvas.pdf{ width:100%!important; height:100%!important; }
  .ed-canvas .ed-layer svg{ width:100%!important; height:100%!important; max-width:none!important; max-height:none!important; }
  .ed-canvas .ed-item img, .ed-canvas .ed-item svg{ width:100%!important; height:100%!important; max-width:none!important; max-height:none!important; }
  .fd-stage svg.fd-edges{ width:1px!important; height:1px!important; max-width:none!important; overflow:visible!important; }
  .st-map svg{ max-width:none!important; }
  .wf-mini svg, .wf-tpl .st-map svg{ height:100%!important; }
  iframe.st-native-pdf{ height:78vh!important; max-height:none!important; width:100%!important; }
</style>
