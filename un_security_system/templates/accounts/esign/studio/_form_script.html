{# accounts/templates/accounts/esign/studio/_form_script.html — table rows and live totals on fill pages #}
{% load esign_studio_tags %}
<script>
(function(){
  // Django refuses a submission with more fields than DATA_UPLOAD_MAX_NUMBER_FIELDS
  // and the person would lose everything they typed. Keep "Add row" under it.
  const MAX_FIELDS = {% esign_max_post_fields %};
  const MARGIN = 25;
  function fieldCount(form){ return form ? [...form.elements].filter(el => el.name && !el.disabled).length : 0; }
  function roomFor(table){
    if (!MAX_FIELDS) return true;
    const cols = table.querySelectorAll("thead th").length - 1;
    return fieldCount(table.closest("form")) + cols <= MAX_FIELDS - MARGIN;
  }
  function syncAdd(table){
    const wrap = table.parentElement, add = wrap.querySelector(".fs-row-add");
    if (!add) return;
    const room = roomFor(table);
    add.disabled = !room;
    let note = wrap.querySelector(".fs-row-limit");
    if (!room && !note){
      note = document.createElement("div"); note.className = "form-text text-warning fs-row-limit";
      note.textContent = "This form can't take more rows — the server accepts a limited number of answers per submission. Submit what you have and add the rest in a second form, or ask ICT to raise the limit.";
      add.after(note);
    } else if (room && note) note.remove();
  }
  function renumber(table){
    const name = table.dataset.table, rows = [...table.tBodies[0].rows];
    rows.forEach((tr, i) => tr.querySelectorAll("input[data-col]").forEach(inp => inp.name = `${name}__${i}__${inp.dataset.col}`));
    const count = table.parentElement.querySelector(`input[name="${name}__rows"]`); if (count) count.value = rows.length;
    totals(table);
    document.querySelectorAll("table[data-table]").forEach(syncAdd);
  }
  function totals(table){
    table.querySelectorAll("[data-total]").forEach(cell => {
      let sum = 0; table.querySelectorAll(`tbody input[data-col="${cell.dataset.total}"]`).forEach(i => { const v = parseFloat((i.value || "").replace(/,/g, "")); if (!isNaN(v)) sum += v; });
      cell.textContent = sum.toLocaleString(undefined, {maximumFractionDigits: 2});
    });
  }
  document.querySelectorAll("table[data-table]").forEach(table => {
    const wrap = table.parentElement;
    table.addEventListener("input", () => totals(table));
    table.addEventListener("click", e => {
      const del = e.target.closest(".fs-row-del"); if (!del) return;
      const tr = del.closest("tr");
      if (table.tBodies[0].rows.length > 1) tr.remove(); else tr.querySelectorAll("input").forEach(i => i.value = "");
      renumber(table);
    });
    const add = wrap.querySelector(".fs-row-add");
    if (add) add.addEventListener("click", () => {
      if (!roomFor(table)){ syncAdd(table); return; }
      const body = table.tBodies[0], last = body.rows[body.rows.length - 1], tr = last.cloneNode(true);
      tr.querySelectorAll("input").forEach(i => i.value = ""); body.appendChild(tr); renumber(table);
      tr.querySelector("input").focus();
    });
    totals(table);
    syncAdd(table);
  });

  // ── conditional states, kept up to date as people type ─────────────────
  const payload = document.getElementById("formLogic");
  if (!payload || !window.StudioRules) return;
  const P = JSON.parse(payload.textContent);
  const hasRules = P.elements.some(el => (el.state_rules || []).length);
  const byKey = {}; P.elements.forEach(el => { if (el.key) byKey[el.key] = el; });

  function readItem(item){
    const key = item.dataset.key, type = item.dataset.type, name = "f_" + key;
    if (type === "checkboxes") return [...item.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
    if (type === "radio" || type === "yesno"){ const c = item.querySelector(`input[name="${name}"]:checked`); return c ? c.value : ""; }
    if (type === "table"){
      return [...item.querySelectorAll("tbody tr")].map(tr => {
        const row = {}; tr.querySelectorAll("input[data-col]").forEach(i => row[i.dataset.col] = i.value.trim()); return row;
      }).filter(r => Object.values(r).some(Boolean));
    }
    const input = item.querySelector(`[name="${name}"]`);
    return input ? input.value : "";
  }
  function answers(){
    const vals = Object.assign({}, P.values);
    document.querySelectorAll('.fs-item[data-mine="1"][data-key]').forEach(item => { vals[item.dataset.key] = readItem(item); });
    return vals;
  }
  const STATES = ["active", "readonly", "completed", "disabled", "hidden"];
  function apply(){
    const states = StudioRules.states(P.elements, answers(), P.scope, P.extras);
    for (const [id, st] of Object.entries(states)){
      const item = document.querySelector(`.fs-item[data-el="${id}"]`);
      if (!item) continue;
      STATES.forEach(s => item.classList.toggle("fs-state-" + s, s === st.state));
      item.classList.toggle("d-none", st.state === "hidden");
      const note = item.querySelector(".fs-state-note");
      if (note){
        if (st.message) note.textContent = st.message;
        note.classList.toggle("fs-note-quiet", st.from === "section" && item.dataset.type !== "heading");
      }
      if (item.dataset.mine !== "1") continue;
      const live = st.state === "active";
      item.querySelectorAll("input, select, textarea, .fs-row-add, .fs-row-del").forEach(ctrl => {
        if (ctrl.type === "hidden") return;
        ctrl.disabled = !live;
      });
      const el = byKey[item.dataset.key];
      const star = item.querySelector(".fs-req");
      if (star) star.classList.toggle("d-none", !(live && el && el.required));
      if (el && el.required && !["checkboxes", "table"].includes(el.type)){
        item.querySelectorAll(`[name="f_${el.key}"]`).forEach(ctrl => { ctrl.required = live; });
      }
    }
    document.querySelectorAll("table[data-table]").forEach(syncAdd);
  }
  if (hasRules){
    const form = payload.closest("form") || document;
    form.addEventListener("input", apply);
    form.addEventListener("change", apply);
    document.addEventListener("click", e => { if (e.target.closest(".fs-row-add, .fs-row-del")) setTimeout(apply, 0); });
    apply();
  }
})();
</script>
