{# accounts/templates/accounts/esign/agents/_agent_styles.html — the Agentic flows look, on top of the studio styles #}
<style>
  :root{ --ag-violet:#7C3AED; --ag-deep:#4C1D95; --ag-soft:#F5F3FF; }
  .ag-hero{ background:
      radial-gradient(1200px 200px at 0% 0%, rgba(124,58,237,.16), transparent 60%),
      radial-gradient(900px 220px at 100% 0%, rgba(0,158,219,.16), transparent 60%), #fff;
    border:1px solid rgba(124,58,237,.18); }
  .ag-spark{ background:linear-gradient(135deg,#7C3AED,#009EDB); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ag-chip{ display:inline-flex; align-items:center; gap:.35rem; font-size:.75rem; font-weight:600; padding:.2rem .55rem; border-radius:999px;
            background:var(--ag-soft); color:var(--ag-deep); border:1px solid #DDD6FE; white-space:nowrap; }
  .ag-chip.off{ background:#F1F5F9; color:#475569; border-color:#E2E8F0; }
  .ag-chip.live{ background:#ECFDF5; color:#065F46; border-color:#A7F3D0; }
  .ag-chip .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .ag-chip.live .dot{ animation:agPulse 1.6s infinite; }
  @keyframes agPulse{ 0%{ box-shadow:0 0 0 0 rgba(16,185,129,.55);} 70%{ box-shadow:0 0 0 7px rgba(16,185,129,0);} 100%{ box-shadow:0 0 0 0 rgba(16,185,129,0);} }
  .btn-ag{ background:linear-gradient(135deg,#7C3AED,#5B21B6); color:#fff; border:0; }
  .btn-ag:hover, .btn-ag:focus{ background:linear-gradient(135deg,#6D28D9,#4C1D95); color:#fff; }
  .btn-outline-ag{ color:#6D28D9; border-color:#C4B5FD; background:#fff; }
  .btn-outline-ag:hover{ background:var(--ag-soft); color:#5B21B6; border-color:#A78BFA; }
  .ag-card{ background:#fff; border:1px solid var(--st-line); border-radius:.7rem; transition:border-color .12s, box-shadow .12s, transform .12s; }
  .ag-card:hover{ border-color:#C4B5FD; box-shadow:0 6px 18px rgba(76,29,149,.08); }
  .ag-mini{ height:118px; overflow:hidden; border-radius:.5rem; }
  .ag-switch .form-check-input{ width:2.4em; height:1.25em; cursor:pointer; }
  .ag-switch .form-check-input:checked{ background-color:#10B981; border-color:#10B981; }
  .ag-out{ white-space:pre-wrap; font-size:.86rem; line-height:1.55; background:#FBFAFF; border:1px solid #EDE9FE; border-radius:.5rem; padding:.7rem .85rem;
           max-height:420px; overflow:auto; color:#1E1B4B; }
  .ag-kv{ font-size:.85rem; } .ag-kv th{ color:#64748B; font-weight:600; width:38%; } .ag-kv td, .ag-kv th{ padding:.3rem .5rem; }
  .ag-step{ position:relative; padding:0 0 1rem 2.6rem; }
  .ag-step:before{ content:""; position:absolute; left:.95rem; top:2.1rem; bottom:0; width:2px; background:#EDE9FE; }
  .ag-step:last-child:before{ display:none; }
  .ag-step .ico{ position:absolute; left:0; top:.1rem; width:2rem; height:2rem; border-radius:.55rem; display:flex; align-items:center; justify-content:center; color:#fff; }
  .ag-step.running .ico{ animation:agSpin 1.2s linear infinite; }
  @keyframes agSpin{ 50%{ opacity:.55; } }
  .ag-thinking{ display:inline-flex; gap:3px; } .ag-thinking i{ width:5px; height:5px; border-radius:50%; background:#7C3AED; animation:agDots 1s infinite; }
  .ag-thinking i:nth-child(2){ animation-delay:.15s; } .ag-thinking i:nth-child(3){ animation-delay:.3s; }
  @keyframes agDots{ 0%,80%,100%{ opacity:.2; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-3px);} }
  .ad-ctx{ border:1.5px solid #DDD6FE; background:#FDFCFF; font-size:.85rem; }
  .ad-ctx:focus{ border-color:#A78BFA; box-shadow:0 0 0 .2rem rgba(124,58,237,.12); }
</style>
