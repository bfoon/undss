{% comment %}
templates/incidents/_incident_styles.html
=========================================

One stylesheet for all four incident pages, included from {% block extra_css %}.

Before this, each page carried its own <style> block inside {% block content %}:
about 29 KB of CSS in total, 46 class names defined in more than one file, and
six of them defined *differently* — .severity-badge, .card-header, .card-title
and three others. That is why the pages did not look like each other: a badge
was one size on the report form and another on the triage list.

Two other things changed:

* The purple gradient (#667eea / #764ba2) that came with the original template
  is gone. It appeared 24 times and matched nothing else in UN PASS. Those are
  now var(--un-blue) and var(--un-dark-blue), the tokens base.html already
  defines, so the incident pages sit in the same palette as the rest of the app.

* CSS in {% block content %} renders a <style> tag inside <body>, which is
  invalid and re-sent on every page load. {% block extra_css %} puts it in
  <head> where it belongs.

Edit a rule here and it changes on all four pages at once.
{% endcomment %}
