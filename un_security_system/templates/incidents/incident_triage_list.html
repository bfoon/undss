{% extends "base.html" %}
{% block title %}Incident Triage - Incident Management{% endblock %}

{% comment %}
  Styles live in incidents/_incident_styles.html, shared by all four
  incident pages. They used to be a <style> block inside
  {% block content %}, which puts a stylesheet inside <body> and gave
  each page its own drifting copy of the same classes.
{% endcomment %}
{% block extra_css %}{% include "incidents/_incident_styles.html" %}{% endblock %}

{% block content %}
<div class="triage-container">
  <div class="container-fluid px-4 py-4" style="max-width: 1600px;">

    <!-- Header Section -->
    <div class="page-header mb-4">
      <div class="row align-items-center">
        <div class="col-md-8">
          <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Incident Triage</li>
            </ol>
          </nav>
          <h2 class="page-title mb-1">
            <i class="bi bi-life-preserver text-danger me-2"></i>
            Incident Triage Dashboard
          </h2>
          <p class="text-muted mb-0">Review and manage all security incidents</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <a class="btn btn-danger" href="{% url 'incidents:new' %}">
            <i class="bi bi-plus-circle me-2"></i>Report Incident
          </a>
        </div>
      </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-3 mb-4">
      <div class="col-lg-3 col-md-6">
        <div class="stat-card shadow-sm">
          <div class="stat-icon stat-icon-primary">
            <i class="bi bi-clipboard-data"></i>
          </div>
          <div class="stat-content">
            <div class="stat-label">All Incidents</div>
            <div class="stat-value">{{ stats.total }}</div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card shadow-sm stat-card-new">
          <div class="stat-icon stat-icon-warning">
            <i class="bi bi-exclamation-circle"></i>
          </div>
          <div class="stat-content">
            <div class="stat-label">New</div>
            <div class="stat-value">{{ stats.new }}</div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card shadow-sm stat-card-review">
          <div class="stat-icon stat-icon-info">
            <i class="bi bi-hourglass-split"></i>
          </div>
          <div class="stat-content">
            <div class="stat-label">In Review</div>
            <div class="stat-value">{{ stats.in_review }}</div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card shadow-sm stat-card-critical">
          <div class="stat-icon stat-icon-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </div>
          <div class="stat-content">
            <div class="stat-label">Critical Priority</div>
            <div class="stat-value">{{ stats.critical }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="card filter-card shadow-sm mb-4">
      <div class="card-body p-3">
        <form method="get" id="filterForm" class="row g-3 align-items-end">
          <div class="col-lg-4 col-md-6">
            <label class="form-label small fw-semibold mb-2">
              <i class="bi bi-search me-1"></i>Search
            </label>
            <input type="text"
                   name="q"
                   value="{{ request.GET.q }}"
                   class="form-control"
                   placeholder="Search by title, ID, or reporter..."
                   id="searchInput">
          </div>
          <div class="col-lg-2 col-md-3 col-sm-6">
            <label class="form-label small fw-semibold mb-2">
              <i class="bi bi-flag me-1"></i>Severity
            </label>
            <select name="severity" class="form-select" id="severityFilter">
              <option value="">All Severity</option>
              <option value="low" {% if request.GET.severity == 'low' %}selected{% endif %}>Low</option>
              <option value="medium" {% if request.GET.severity == 'medium' %}selected{% endif %}>Medium</option>
              <option value="high" {% if request.GET.severity == 'high' %}selected{% endif %}>High</option>
              <option value="critical" {% if request.GET.severity == 'critical' %}selected{% endif %}>Critical</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-3 col-sm-6">
            <label class="form-label small fw-semibold mb-2">
              <i class="bi bi-toggle-on me-1"></i>Status
            </label>
            <select name="status" class="form-select" id="statusFilter">
              <option value="">All Status</option>
              <option value="new" {% if request.GET.status == 'new' %}selected{% endif %}>New</option>
              <option value="in_review" {% if request.GET.status == 'in_review' %}selected{% endif %}>In Review</option>
              <option value="resolved" {% if request.GET.status == 'resolved' %}selected{% endif %}>Resolved</option>
              <option value="dismissed" {% if request.GET.status == 'dismissed' %}selected{% endif %}>Dismissed</option>
            </select>
          </div>
          <div class="col-lg-4 col-md-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-funnel me-2"></i>Apply Filters
            </button>
            <a href="{% url 'incidents:triage' %}" class="btn btn-outline-secondary">
              <i class="bi bi-x-circle"></i>
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Incidents Table Card -->
    <div class="card table-card shadow-sm">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">
            <i class="bi bi-list-ul me-2"></i>All Incidents
          </h5>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary">
              {{ incidents|length }} Incident{{ incidents|length|pluralize }}
            </span>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary active" data-view="table">
                <i class="bi bi-table"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary" data-view="cards">
                <i class="bi bi-grid-3x2"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      {% if incidents %}
        <!-- Table View -->
        <div class="table-view">
          <div class="table-responsive">
            <table class="table incidents-table mb-0">
              <thead>
                <tr>
                  <th style="width: 8%;">ID</th>
                  <th style="width: 28%;">Title</th>
                  <th style="width: 12%;">Severity</th>
                  <th style="width: 13%;">Status</th>
                  <th style="width: 13%;">Reporter</th>
                  <th style="width: 14%;">Created</th>
                  <th style="width: 12%;" class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for i in incidents %}
                  <tr class="incident-row {% if i.severity == 'critical' %}row-critical{% endif %}">
                    <td>
                      <span class="incident-id">
                        <i class="bi bi-hash text-muted"></i>{{ i.id }}
                      </span>
                    </td>
                    <td>
                      <a href="{% url 'incidents:incident_detail' i.pk %}" class="incident-title-link">
                        <strong>{{ i.title|truncatewords:8 }}</strong>
                      </a>
                    </td>
                    <td>
                      {% if i.severity == 'critical' %}
                        <span class="severity-badge severity-critical">
                          <i class="bi bi-exclamation-triangle-fill me-1"></i>Critical
                        </span>
                      {% elif i.severity == 'high' %}
                        <span class="severity-badge severity-high">
                          <i class="bi bi-exclamation-circle-fill me-1"></i>High
                        </span>
                      {% elif i.severity == 'medium' %}
                        <span class="severity-badge severity-medium">
                          <i class="bi bi-info-circle-fill me-1"></i>Medium
                        </span>
                      {% else %}
                        <span class="severity-badge severity-low">
                          <i class="bi bi-dash-circle-fill me-1"></i>Low
                        </span>
                      {% endif %}
                    </td>
                    <td>
                      {% if i.status == 'new' %}
                        <span class="status-badge status-new">
                          <i class="bi bi-circle-fill me-1"></i>New
                        </span>
                      {% elif i.status == 'in_review' %}
                        <span class="status-badge status-review">
                          <i class="bi bi-hourglass-split me-1"></i>In Review
                        </span>
                      {% elif i.status == 'resolved' %}
                        <span class="status-badge status-resolved">
                          <i class="bi bi-check-circle-fill me-1"></i>Resolved
                        </span>
                      {% else %}
                        <span class="status-badge status-dismissed">
                          <i class="bi bi-x-circle-fill me-1"></i>Dismissed
                        </span>
                      {% endif %}
                    </td>
                    <td>
                      <div class="reporter-info">
                        <i class="bi bi-person-circle text-muted me-1"></i>
                        <span>{{ i.reported_by.username }}</span>
                      </div>
                    </td>
                    <td>
                      <div class="date-info">
                        <div class="date-primary">{{ i.created_at|date:"M d, Y" }}</div>
                        <div class="date-time">{{ i.created_at|date:"g:i A" }}</div>
                      </div>
                    </td>
                    <td class="text-end">
                      <div class="btn-group btn-group-sm" role="group">
                        <a href="{% url 'incidents:incident_detail' i.pk %}"
                           class="btn btn-outline-primary"
                           data-bs-toggle="tooltip"
                           title="View Details">
                          <i class="bi bi-eye"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Cards View (Hidden by default) -->
        <div class="cards-view" style="display: none;">
          <div class="row g-3 p-3">
            {% for i in incidents %}
              <div class="col-lg-4 col-md-6">
                <div class="incident-card shadow-sm">
                  <div class="incident-card-header {% if i.severity == 'critical' %}header-critical{% elif i.severity == 'high' %}header-high{% endif %}">
                    <div class="d-flex justify-content-between align-items-start">
                      <span class="incident-card-id">#{{ i.id }}</span>
                      {% if i.severity == 'critical' %}
                        <span class="severity-badge-small severity-critical">Critical</span>
                      {% elif i.severity == 'high' %}
                        <span class="severity-badge-small severity-high">High</span>
                      {% elif i.severity == 'medium' %}
                        <span class="severity-badge-small severity-medium">Medium</span>
                      {% else %}
                        <span class="severity-badge-small severity-low">Low</span>
                      {% endif %}
                    </div>
                  </div>
                  <div class="incident-card-body">
                    <h6 class="incident-card-title">{{ i.title|truncatewords:10 }}</h6>
                    <div class="incident-card-meta">
                      <div class="meta-item">
                        <i class="bi bi-person-circle me-1"></i>
                        <span>{{ i.reported_by.username }}</span>
                      </div>
                      <div class="meta-item">
                        <i class="bi bi-calendar me-1"></i>
                        <span>{{ i.created_at|date:"M d, Y" }}</span>
                      </div>
                      <div class="meta-item">
                        {% if i.status == 'new' %}
                          <span class="status-badge-small status-new">New</span>
                        {% elif i.status == 'in_review' %}
                          <span class="status-badge-small status-review">In Review</span>
                        {% elif i.status == 'resolved' %}
                          <span class="status-badge-small status-resolved">Resolved</span>
                        {% else %}
                          <span class="status-badge-small status-dismissed">Dismissed</span>
                        {% endif %}
                      </div>
                    </div>
                  </div>
                  <div class="incident-card-footer">
                    <a href="{% url 'incidents:incident_detail' i.pk %}" class="btn btn-sm btn-primary w-100">
                      <i class="bi bi-eye me-1"></i>View Details
                    </a>
                  </div>
                </div>
              </div>
            {% endfor %}
          </div>
        </div>
      {% else %}
        <div class="card-body empty-state text-center py-5">
          <div class="empty-icon mb-3">
            <i class="bi bi-clipboard-pulse"></i>
          </div>
          <h5 class="empty-title">No Incidents Found</h5>
          <p class="empty-text text-muted mb-4">
            {% if request.GET.q or request.GET.severity or request.GET.status %}
              No incidents match your search criteria. Try adjusting your filters.
            {% else %}
              There are no incidents to review at this time.
            {% endif %}
          </p>
          {% if request.GET.q or request.GET.severity or request.GET.status %}
            <a href="{% url 'incidents:triage' %}" class="btn btn-outline-secondary">
              <i class="bi bi-x-circle me-2"></i>Clear Filters
            </a>
          {% endif %}
        </div>
      {% endif %}
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize tooltips
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });

      // View toggle functionality
      const tableView = document.querySelector('.table-view');
      const cardsView = document.querySelector('.cards-view');
      const viewButtons = document.querySelectorAll('[data-view]');

      viewButtons.forEach(button => {
        button.addEventListener('click', function() {
          const view = this.getAttribute('data-view');

          // Update active button
          viewButtons.forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');

          // Toggle views
          if (view === 'table') {
            tableView.style.display = 'block';
            cardsView.style.display = 'none';
          } else {
            tableView.style.display = 'none';
            cardsView.style.display = 'block';
          }
        });
      });

      // Search input enhancement
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            document.getElementById('filterForm').submit();
          }
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + K to focus search
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          if (searchInput) searchInput.focus();
        }
      });
    });
  </script>
{% endblock %}
