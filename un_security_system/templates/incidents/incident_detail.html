{% extends "base.html" %}
{% block title %}Incident #{{ incident.pk }} - Incident Management{% endblock %}

{% comment %}
  Styles live in incidents/_incident_styles.html, shared by all four
  incident pages. They used to be a <style> block inside
  {% block content %}, which puts a stylesheet inside <body> and gave
  each page its own drifting copy of the same classes.
{% endcomment %}
{% block extra_css %}{% include "incidents/_incident_styles.html" %}{% endblock %}

{# templates/incidents/incident_detail.html #}




{% block content %}
<div class="incident-detail-container">
  <div class="container-fluid px-4 py-4" style="max-width: 1400px;">

    <!-- Header Section -->
    <div class="page-header mb-4">
      <div class="row align-items-center">
        <div class="col-md-8">
          <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item"><a href="{% url 'incidents:my_incidents' %}">My Incidents</a></li>
              <li class="breadcrumb-item active" aria-current="page">Incident #{{ incident.pk }}</li>
            </ol>
          </nav>
          <h2 class="page-title mb-2">
            <i class="bi bi-shield-exclamation text-danger me-2"></i>
            {{ incident.title }}
          </h2>
          <div class="incident-meta">
            <span class="meta-item">
              <i class="bi bi-person-circle me-1"></i>
              <strong>{{ incident.reported_by.username }}</strong>
            </span>
            <span class="meta-separator">•</span>
            <span class="meta-item">
              <i class="bi bi-calendar-event me-1"></i>
              {{ incident.created_at|date:"F j, Y" }} at {{ incident.created_at|date:"g:i A" }}
            </span>
            <span class="meta-separator">•</span>
            <span class="meta-item">
              <i class="bi bi-hash me-1"></i>
              ID: {{ incident.pk }}
            </span>
          </div>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <a class="btn btn-outline-secondary" href="{% url 'incidents:my_incidents' %}">
            <i class="bi bi-arrow-left me-2"></i>Back to List
          </a>
        </div>
      </div>
    </div>

    <!-- Alert Messages -->
    {% if messages %}
      <div class="alerts-container mb-4">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'danger' %}exclamation-circle-fill{% else %}info-circle-fill{% endif %} me-2"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="row g-4">
      <!-- Main Content Column -->
      <div class="col-lg-8">

        <!-- Incident Details Card -->
        <div class="card detail-card shadow-sm mb-4">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="bi bi-file-text me-2"></i>Incident Details
            </h5>
          </div>
          <div class="card-body p-0">
            <div class="detail-list">

              <div class="detail-item">
                <div class="detail-label">
                  <i class="bi bi-flag-fill"></i>
                  <span>Severity</span>
                </div>
                <div class="detail-value">
                  {% if incident.severity == 'critical' %}
                    <span class="severity-badge severity-critical">
                      <i class="bi bi-exclamation-triangle-fill me-1"></i>Critical
                    </span>
                  {% elif incident.severity == 'high' %}
                    <span class="severity-badge severity-high">
                      <i class="bi bi-exclamation-circle-fill me-1"></i>High
                    </span>
                  {% elif incident.severity == 'medium' %}
                    <span class="severity-badge severity-medium">
                      <i class="bi bi-info-circle-fill me-1"></i>Medium
                    </span>
                  {% else %}
                    <span class="severity-badge severity-low">
                      <i class="bi bi-dash-circle-fill me-1"></i>Low
                    </span>
                  {% endif %}
                </div>
              </div>

              <div class="detail-item">
                <div class="detail-label">
                  <i class="bi bi-folder-fill"></i>
                  <span>Category</span>
                </div>
                <div class="detail-value">
                  {% if incident.category %}
                    <span class="badge bg-light text-dark border">{{ incident.category }}</span>
                  {% else %}
                    <span class="text-muted fst-italic">Not specified</span>
                  {% endif %}
                </div>
              </div>

              <div class="detail-item">
                <div class="detail-label">
                  <i class="bi bi-geo-alt-fill"></i>
                  <span>Location</span>
                </div>
                <div class="detail-value">
                  {% if incident.location %}
                    {{ incident.location }}
                  {% else %}
                    <span class="text-muted fst-italic">Not specified</span>
                  {% endif %}
                </div>
              </div>

              <div class="detail-item">
                <div class="detail-label">
                  <i class="bi bi-clock-history"></i>
                  <span>Occurred At</span>
                </div>
                <div class="detail-value">
                  {{ incident.occurred_at|date:"F j, Y" }} at {{ incident.occurred_at|date:"g:i A" }}
                </div>
              </div>

              <div class="detail-item border-0">
                <div class="detail-label">
                  <i class="bi bi-text-paragraph"></i>
                  <span>Description</span>
                </div>
                <div class="detail-value">
                  <div class="description-box">
                    {{ incident.description|linebreaks }}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Attachment Card -->
        {% if incident.attachment %}
          <div class="card attachment-card shadow-sm">
            <div class="card-header">
              <h5 class="card-title mb-0">
                <i class="bi bi-paperclip me-2"></i>Attachment
              </h5>
            </div>
            <div class="card-body">
              <div class="attachment-info">
                <div class="attachment-icon">
                  <i class="bi bi-file-earmark-arrow-down"></i>
                </div>
                <div class="attachment-details">
                  <div class="attachment-name">{{ incident.attachment.name|default:"Attached File" }}</div>
                  <div class="attachment-meta text-muted small">Click to download or view</div>
                </div>
                <a href="{{ incident.attachment.url }}" target="_blank" class="btn btn-outline-primary">
                  <i class="bi bi-download me-2"></i>Download
                </a>
              </div>
            </div>
          </div>
        {% endif %}
      </div>

      <!-- Sidebar Column -->
      <div class="col-lg-4">

        <!-- Status Card -->
        <div class="card status-card shadow-sm mb-4">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="bi bi-toggle-on me-2"></i>Status
            </h5>
          </div>
          <div class="card-body text-center p-4">
            <div class="status-display mb-4">
              {% if incident.status == 'new' %}
                <div class="status-icon status-icon-new">
                  <i class="bi bi-circle-fill"></i>
                </div>
                <h4 class="status-title text-warning mt-3">New</h4>
                <p class="status-description">Awaiting review</p>
              {% elif incident.status == 'in_review' %}
                <div class="status-icon status-icon-review">
                  <i class="bi bi-hourglass-split"></i>
                </div>
                <h4 class="status-title text-info mt-3">In Review</h4>
                <p class="status-description">Under investigation</p>
              {% elif incident.status == 'resolved' %}
                <div class="status-icon status-icon-resolved">
                  <i class="bi bi-check-circle-fill"></i>
                </div>
                <h4 class="status-title text-success mt-3">Resolved</h4>
                <p class="status-description">Issue has been addressed</p>
              {% else %}
                <div class="status-icon status-icon-dismissed">
                  <i class="bi bi-x-circle-fill"></i>
                </div>
                <h4 class="status-title text-secondary mt-3">Dismissed</h4>
                <p class="status-description">Not actionable</p>
              {% endif %}
            </div>

            {% if can_triage %}
              <div class="status-update-form">
                <hr class="my-4">
                <h6 class="mb-3">Update Status</h6>
                <form method="post" action="{% url 'incidents:change_status' incident.pk %}">
                  {% csrf_token %}
                  <div class="mb-3">
                    <select name="status" class="form-select">
                      {% for k, v in status_choices %}
                        <option value="{{ k }}" {% if k == incident.status %}selected{% endif %}>{{ v }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-arrow-repeat me-2"></i>Update Status
                  </button>
                </form>
              </div>
            {% endif %}
          </div>
        </div>

        <!-- Reporter Info Card -->
        <div class="card reporter-card shadow-sm mb-4">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="bi bi-person-circle me-2"></i>Reporter
            </h5>
          </div>
          <div class="card-body">
            <div class="reporter-info">
              <div class="reporter-avatar">
                <i class="bi bi-person-circle"></i>
              </div>
              <div class="reporter-details">
                <div class="reporter-name">{{ incident.reported_by.get_full_name|default:incident.reported_by.username }}</div>
                <div class="reporter-username text-muted">@{{ incident.reported_by.username }}</div>
                {% if incident.reported_by.email %}
                  <div class="reporter-email mt-2">
                    <a href="mailto:{{ incident.reported_by.email }}" class="text-decoration-none">
                      <i class="bi bi-envelope me-1"></i>{{ incident.reported_by.email }}
                    </a>
                  </div>
                {% endif %}
              </div>
            </div>
          </div>
        </div>

        <!-- Timeline Card -->
        <div class="card timeline-card shadow-sm">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="bi bi-clock-history me-2"></i>Timeline
            </h5>
          </div>
          <div class="card-body">
            <div class="timeline">
              <div class="timeline-item">
                <div class="timeline-icon timeline-icon-created">
                  <i class="bi bi-plus-circle"></i>
                </div>
                <div class="timeline-content">
                  <div class="timeline-title">Incident Reported</div>
                  <div class="timeline-date">{{ incident.created_at|date:"M d, Y" }} at {{ incident.created_at|date:"g:i A" }}</div>
                  <div class="timeline-user">by {{ incident.reported_by.username }}</div>
                </div>
              </div>

              {% if incident.updated_at != incident.created_at %}
                <div class="timeline-item">
                  <div class="timeline-icon timeline-icon-updated">
                    <i class="bi bi-pencil"></i>
                  </div>
                  <div class="timeline-content">
                    <div class="timeline-title">Last Updated</div>
                    <div class="timeline-date">{{ incident.updated_at|date:"M d, Y" }} at {{ incident.updated_at|date:"g:i A" }}</div>
                  </div>
                </div>
              {% endif %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Auto-dismiss alerts
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(function(alert) {
        setTimeout(function() {
          const bsAlert = new bootstrap.Alert(alert);
          bsAlert.close();
        }, 5000);
      });
    });
  </script>
{% endblock %}
